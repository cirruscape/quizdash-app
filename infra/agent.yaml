AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Quiz App generation agent (PLAN §8, §9; Spike A): an AgentCore Runtime running the
  Strands container image, allowed to call one Bedrock model (see Mappings) through the
  Converse API. Stack name: quizapp-{env}-agent.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  ImageTag:
    Type: String
    Description: Tag of the agent image in the foundation stack's ECR repository (the git SHA).
    AllowedPattern: '[A-Za-z0-9._-]+'

# The model is configuration (ADR 0005), and lives here rather than in Parameters on purpose:
# `aws cloudformation deploy` reuses a stack's previous parameter values, so changing a
# parameter's default never reaches an existing stack. Editing this table changes the template,
# so every deploy applies it. To swap a model, change both values for the environment and push.
#   ModelId:           the Bedrock inference profile the agent calls (geographic or global)
#   FoundationModelId: the model behind it (ModelId without its profile prefix)
# Intended once the account has Anthropic access:
#   ModelId: au.anthropic.claude-opus-5-5, FoundationModelId: anthropic.claude-opus-5-5
Mappings:
  Models:
    dev:
      ModelId: global.amazon.nova-2-lite-v1:0
      FoundationModelId: amazon.nova-2-lite-v1:0
    prod:
      ModelId: global.amazon.nova-2-lite-v1:0
      FoundationModelId: amazon.nova-2-lite-v1:0

Resources:
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub quizapp-${Env}-agent-runtime
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrImage
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/quizapp-${Env}-agent
              - Sid: EcrToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DescribeLogStreams]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Sid: LogGroups
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Sid: LogEvents
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              - Sid: Tracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                  - xray:GetSamplingRules
                  - xray:GetSamplingTargets
                Resource: '*'
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: WorkloadIdentity
                Effect: Allow
                Action:
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:GetWorkloadAccessTokenForJWT
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/quizapp_${Env}_generator-*
              # Converse API only (ADR 0005). The agent streams via ConverseStream, which needs
              # InvokeModelWithResponseStream; InvokeModel covers non-streaming Converse.
              # The profile may route to the model in any destination Region; the foundation-model
              # grants are limited to requests that arrive through our profile. The region-less
              # ARN is what global profiles are authorised against.
              - Sid: InvokeModelViaProfile
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: !Sub
                  - arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                  - ModelId: !FindInMap [Models, !Ref Env, ModelId]
              - Sid: InvokeFoundationModelThroughProfile
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  - !Sub
                    - arn:aws:bedrock:*::foundation-model/${FoundationModelId}
                    - FoundationModelId: !FindInMap [Models, !Ref Env, FoundationModelId]
                  - !Sub
                    - arn:aws:bedrock:::foundation-model/${FoundationModelId}
                    - FoundationModelId: !FindInMap [Models, !Ref Env, FoundationModelId]
                Condition:
                  StringEquals:
                    bedrock:InferenceProfileArn: !Sub
                      - arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}
                      - ModelId: !FindInMap [Models, !Ref Env, ModelId]

  Runtime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Sub quizapp_${Env}_generator
      Description: Quiz App Quiz generation agent (Strands, TypeScript).
      RoleArn: !GetAtt ExecutionRole.Arn
      ProtocolConfiguration: HTTP
      NetworkConfiguration:
        NetworkMode: PUBLIC
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Sub
            - '${RepositoryUri}:${ImageTag}'
            - RepositoryUri: { 'Fn::ImportValue': !Sub 'quizapp-${Env}-AgentRepositoryUri' }
      EnvironmentVariables:
        MODEL_ID: !FindInMap [Models, !Ref Env, ModelId]

Outputs:
  RuntimeArn:
    Value: !GetAtt Runtime.AgentRuntimeArn
    Export:
      Name: !Sub quizapp-${Env}-AgentRuntimeArn
  RuntimeId:
    Value: !GetAtt Runtime.AgentRuntimeId
