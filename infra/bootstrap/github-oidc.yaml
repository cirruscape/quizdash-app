AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  One-off bootstrap, deployed by hand once per environment (PLAN §10, M0):
  lets GitHub Actions deploy Quiz App stacks through OIDC, with no long-lived keys.
  Stack name: quizapp-{env}-bootstrap.

  GitHub assumes DeployRole, which can only drive CloudFormation, push agent images,
  upload SAM artifacts and update the website. CloudFormation itself creates
  resources using CfnExecutionRole.

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  GitHubRepository:
    Type: String
    Description: owner/repo, e.g. my-org/quizapp
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  GitHubSubjectPrefix:
    Type: String
    Default: ''
    Description: >-
      The OIDC "sub" claim prefix GitHub sends for this repo. Leave empty for the classic
      format (repo:owner/repo). Repos using immutable subjects send
      repo:owner@ownerId/repo@repoId, shown as sub_claim_prefix by
      GET /repos/{owner}/{repo}/actions/oidc/customization/sub.
    AllowedPattern: '(repo:[A-Za-z0-9_.@-]+/[A-Za-z0-9_.@-]+)?'
  CreateOidcProvider:
    Type: String
    AllowedValues: ['true', 'false']
    Default: 'true'
    Description: The GitHub OIDC provider exists once per account. Set to false for the second environment.
  ExistingOidcProviderArn:
    Type: String
    Default: ''
    Description: Required when CreateOidcProvider is false.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, 'true']
  ClassicSubject: !Equals [!Ref GitHubSubjectPrefix, '']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ArtifactsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub quizapp-${Env}-artifacts-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30

  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub quizapp-${Env}-cfn-execution
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      # Broad on purpose: CloudFormation creates IAM roles, Lambdas, AgentCore and more.
      # Only CloudFormation can assume this role, and only DeployRole can pass it.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub quizapp-${Env}-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If [CreateProvider, !Ref GitHubOidcProvider, !Ref ExistingOidcProviderArn]
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflow jobs bound to the matching GitHub Environment can assume this role.
                token.actions.githubusercontent.com:sub: !If
                  - ClassicSubject
                  - !Sub repo:${GitHubRepository}:environment:${Env}
                  - !Sub ${GitHubSubjectPrefix}:environment:${Env}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplateSummary
                  - cloudformation:ListExports
                Resource: '*'
              - Sid: PassExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:ListBucket, s3:GetBucketLocation]
                Resource:
                  - !GetAtt ArtifactsBucket.Arn
                  - !Sub ${ArtifactsBucket.Arn}/*
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                  - ecr:BatchGetImage
                  - ecr:DescribeImages
                Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/quizapp-${Env}-*
              - Sid: Website
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject, s3:ListBucket]
                Resource:
                  - !Sub arn:aws:s3:::quizapp-${Env}-web-*
                  - !Sub arn:aws:s3:::quizapp-${Env}-web-*/*
              - Sid: SmokeTestAgent
                Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/quizapp_${Env}_*
                  - !Sub arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:runtime/quizapp_${Env}_*/runtime-endpoint/*
              # The API smoke test (scripts/smoke.ts): manage and sign in its own test Host...
              - Sid: SmokeTestHost
                Effect: Allow
                Action:
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminInitiateAuth
                Resource: !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*
              # ...and seed its Quiz and clear its active-Game claim.
              - Sid: SmokeTestData
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:DeleteItem]
                Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/quizapp-${Env}
              - Sid: CloudFrontInvalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/*

# Set each of the first three outputs as a variable on the matching GitHub Environment.
Outputs:
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  CfnExecutionRoleArn:
    Description: GitHub variable CFN_EXECUTION_ROLE_ARN
    Value: !GetAtt CfnExecutionRole.Arn
  ArtifactsBucketName:
    Description: GitHub variable ARTIFACTS_BUCKET
    Value: !Ref ArtifactsBucket
  OidcProviderArn:
    Condition: CreateProvider
    Value: !Ref GitHubOidcProvider
