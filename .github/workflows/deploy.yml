name: Deploy

# Deploys the M0 stacks to dev on every push to main (PLAN §9, §10):
#   CI -> foundation -> agent image -> agent stack + generation smoke test
#                                    -> api stack -> API smoke test
#                             -> web stack + app
#      -> certs (us-east-1)  ---------^
# Prod deployment (tags, approvals) arrives in M5.
#
# The environment's domain comes from infra/params/{env}.json (M6). Every deploy passes it
# explicitly, because `aws cloudformation deploy` otherwise keeps a parameter's previous value.
#
# Requires a GitHub Environment named "dev" with these variables, taken from the outputs of
# the quizapp-dev-bootstrap stack (see README):
#   AWS_DEPLOY_ROLE_ARN, CFN_EXECUTION_ROLE_ARN, ARTIFACTS_BUCKET

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  APP_ENV: dev
  PARAMS: infra/params/dev.json

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  foundation:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy foundation stack
        run: |
          aws cloudformation deploy \
            --stack-name "quizapp-${APP_ENV}-foundation" \
            --template-file infra/foundation.yaml \
            --capabilities CAPABILITY_AUTO_EXPAND \
            --role-arn "${{ vars.CFN_EXECUTION_ROLE_ARN }}" \
            --parameter-overrides Env="${APP_ENV}" \
            --no-fail-on-empty-changeset

  # CloudFront only accepts certificates from us-east-1, and exports can't cross Regions, so the
  # certificate's ARN reaches the web job as a job output.
  certs:
    needs: ci
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      certificate-arn: ${{ steps.deploy.outputs.arn }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          # GitHub drops a job output containing a masked value, and the ARN holds the account ID.
          mask-aws-account-id: false

      - name: Deploy certs stack (us-east-1)
        id: deploy
        run: |
          DOMAIN=$(jq -r '.DomainName // ""' "$PARAMS")
          if [ -z "$DOMAIN" ]; then
            echo "No DomainName in $PARAMS; the site uses its CloudFront domain."
            echo "arn=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          aws cloudformation deploy \
            --stack-name "quizapp-${APP_ENV}-certs" \
            --template-file infra/certs.yaml \
            --role-arn "${{ vars.CFN_EXECUTION_ROLE_ARN }}" \
            --parameter-overrides Env="${APP_ENV}" DomainName="$DOMAIN" \
              HostedZoneId="$(jq -r .HostedZoneId "$PARAMS")" \
            --no-fail-on-empty-changeset
          ARN=$(aws cloudformation describe-stacks --stack-name "quizapp-${APP_ENV}-certs" \
            --query "Stacks[0].Outputs[?OutputKey=='SiteCertificateArn'].OutputValue" --output text)
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

  agent-image:
    needs: foundation
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Bundle agent
        run: pnpm --filter @quizapp/agent bundle

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Check whether this commit's image already exists
        id: exists
        run: |
          # Tags are immutable, so a re-run of the same commit must not push again.
          if aws ecr describe-images --repository-name "quizapp-${APP_ENV}-agent" \
               --image-ids imageTag="${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # AgentCore requires arm64. The image only copies the pre-built bundle, so building
      # it under QEMU on an x86 runner is quick.
      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - if: steps.exists.outputs.found == 'false'
        uses: docker/setup-buildx-action@v4

      - if: steps.exists.outputs.found == 'false'
        uses: docker/build-push-action@v7
        with:
          context: packages/agent
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/quizapp-${{ env.APP_ENV }}-agent:${{ github.sha }}

  agent:
    needs: agent-image
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy agent stack
        run: |
          aws cloudformation deploy \
            --stack-name "quizapp-${APP_ENV}-agent" \
            --template-file infra/agent.yaml \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "${{ vars.CFN_EXECUTION_ROLE_ARN }}" \
            --parameter-overrides Env="${APP_ENV}" ImageTag="${GITHUB_SHA}" \
            --no-fail-on-empty-changeset

      - name: Smoke test (the agent generates a small Quiz)
        run: |
          ARN=$(aws cloudformation describe-stacks --stack-name "quizapp-${APP_ENV}-agent" \
            --query "Stacks[0].Outputs[?OutputKey=='RuntimeArn'].OutputValue" --output text)
          echo '{"mode":"generate","topic":"The solar system","difficulty":"EASY","count":3,"avoid":[]}' > payload.json
          # Session IDs must be at least 33 characters.
          aws bedrock-agentcore invoke-agent-runtime \
            --agent-runtime-arn "$ARN" \
            --runtime-session-id "ci-smoke-$(cat /proc/sys/kernel/random/uuid)" \
            --content-type application/json \
            --payload fileb://payload.json \
            response.json
          cat response.json; echo
          jq -e '.status == "success" and (.questions | length) >= 1' response.json

  api:
    # The worker Lambda imports the agent runtime's ARN, so the agent stack goes first.
    needs: [foundation, agent]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Bundle Lambdas
        run: pnpm --filter @quizapp/api bundle

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy api stack
        run: |
          sam deploy \
            --template-file infra/api.yaml \
            --stack-name "quizapp-${APP_ENV}-api" \
            --s3-bucket "${{ vars.ARTIFACTS_BUCKET }}" \
            --s3-prefix api \
            --role-arn "${{ vars.CFN_EXECUTION_ROLE_ARN }}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides Env="${APP_ENV}" \
              DomainName="$(jq -r '.DomainName // ""' "$PARAMS")" \
              HostedZoneId="$(jq -r '.HostedZoneId // ""' "$PARAMS")" \
            --region "${AWS_REGION}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

  web:
    needs: [api, certs]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @quizapp/web build

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy web stack
        run: |
          aws cloudformation deploy \
            --stack-name "quizapp-${APP_ENV}-web" \
            --template-file infra/web.yaml \
            --role-arn "${{ vars.CFN_EXECUTION_ROLE_ARN }}" \
            --parameter-overrides Env="${APP_ENV}" \
              DomainName="$(jq -r '.DomainName // ""' "$PARAMS")" \
              HostedZoneId="$(jq -r '.HostedZoneId // ""' "$PARAMS")" \
              CertificateArn="${{ needs.certs.outputs.certificate-arn }}" \
            --no-fail-on-empty-changeset

      - name: Publish the app
        run: |
          out() { aws cloudformation describe-stacks --stack-name "quizapp-${APP_ENV}-$1" \
            --query "Stacks[0].Outputs[?OutputKey=='$2'].OutputValue" --output text; }
          BUCKET=$(out web BucketName)
          DISTRIBUTION=$(out web DistributionId)
          # One build serves every environment; its settings come from config.json (PLAN §9).
          jq -n \
            --arg region "$AWS_REGION" \
            --arg userPoolId "$(out foundation UserPoolId)" \
            --arg userPoolClientId "$(out foundation UserPoolClientId)" \
            --arg eventsHttpDomain "$(out api EventsHttpDomain)" \
            --arg eventsRealtimeDomain "$(out api EventsRealtimeDomain)" \
            '$ARGS.named' > packages/web/dist/config.json
          # Content-hashed assets are immutable; index.html and config.json must never go stale.
          aws s3 sync packages/web/dist/assets "s3://$BUCKET/assets" --delete \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync packages/web/dist "s3://$BUCKET" --delete --exclude "assets/*" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" \
            --paths /index.html /config.json >/dev/null
          echo "App: $(out web Url)"

      - name: Check the domain (the site, and www redirecting to it)
        run: |
          DOMAIN=$(jq -r '.DomainName // ""' "$PARAMS")
          [ -z "$DOMAIN" ] && exit 0
          # New DNS records can take a minute to resolve everywhere.
          curl -fsS -o /dev/null --retry 6 --retry-all-errors --retry-delay 10 "https://$DOMAIN/"
          GOT=$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' --retry 6 --retry-all-errors \
            --retry-delay 10 "https://www.$DOMAIN/join?code=ABC234")
          echo "www: $GOT"
          [ "$GOT" = "301 https://$DOMAIN/join?code=ABC234" ]

  smoke:
    needs: api
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: corepack enable
      - run: pnpm install --frozen-lockfile

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: API smoke test (a whole Game over HTTP and AppSync Events)
        run: pnpm --filter @quizapp/scripts smoke
