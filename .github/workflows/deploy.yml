name: Deploy

# Every push to main deploys dev and runs its smoke tests (PLAN §10). See deploy-env.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  dev:
    needs: ci
    uses: ./.github/workflows/deploy-env.yml
    permissions:
      contents: read
      id-token: write
    with:
      env: dev
